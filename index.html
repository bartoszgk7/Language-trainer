<style>:root{--bg:#f4f6fa;--card:#fff;--ink:#16202e;--mute:#5c6b80;--line:#dde3ec;--pri:#1f6feb;--pri-ink:#fff;--ok:#1a9a50;--okbg:#e2f6ea;--bad:#d0342c;--badbg:#fdeceb;--warn:#b7791f;--shadow:0 1px 3px rgba(20,30,50,.08),0 4px 14px rgba(20,30,50,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1520;--card:#18202e;--ink:#e8edf5;--mute:#93a1b7;--line:#2a3547;--pri:#4c8dff;--pri-ink:#07111f;--ok:#46c37b;--okbg:#12301f;--bad:#ff6b63;--badbg:#3a1816;--warn:#e0a94a;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:14px 14px calc(88px + env(safe-area-inset-bottom))}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
#nav button{flex:1;max-width:210px;background:none;border:0;color:var(--mute);padding:8px 4px 10px;font:600 12px system-ui;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button span{font-size:22px}#nav button.on{color:var(--pri)}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:18px 0 8px}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.grow{flex:1}.wrap{flex-wrap:wrap}
.mute{color:var(--mute);font-size:14px}.small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-weight:600;font-size:14px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:9px 6px;border-radius:9px;font:600 14px system-ui}
.seg button.on{background:var(--pri);color:var(--pri-ink)}
select,input[type=text]{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
input[type=text]:focus,select:focus{outline:2px solid var(--pri);border-color:transparent}
.btn{display:block;width:100%;border:0;background:var(--pri);color:var(--pri-ink);padding:14px;border-radius:14px;font:700 16px system-ui;margin-top:10px}
.btn.alt{background:var(--card);color:var(--pri);border:1.5px solid var(--pri)}.btn.ghost{background:none;color:var(--mute);font-weight:600}.btn.sm{width:auto;padding:9px 14px;font-size:14px;display:inline-block;margin:0}
.btn:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 10px;text-align:left;color:var(--ink);font:inherit;box-shadow:var(--shadow)}
.ex b{display:block;font-size:15px;margin-top:4px}.ex span.ic{font-size:26px}.ex small{color:var(--mute);font-size:12.5px;line-height:1.3;display:block}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.prompt{font-size:28px;font-weight:800;text-align:center;margin:14px 0 4px;word-break:break-word}
.prompt.sent{font-size:21px;line-height:1.35}
.sub{text-align:center;color:var(--mute);margin:0 0 12px;font-size:15px}
.dirtag{font-size:12px;font-weight:700;color:var(--mute);text-align:center;letter-spacing:.06em;text-transform:uppercase}
.opts{display:grid;gap:9px;margin-top:10px}
.opt{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:15px 12px;font:600 17px system-ui;text-align:center}
.opt.ok,.cell.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.opt.no,.cell.no{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.fb{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px}.fb.ok{background:var(--okbg);color:var(--ok)}.fb.no{background:var(--badbg);color:var(--bad)}
.fb b{color:var(--ink)}
.tip{background:linear-gradient(135deg,rgba(31,111,235,.10),rgba(31,111,235,.03));border:1px solid rgba(31,111,235,.25);border-radius:14px;padding:10px 12px;font-size:14px;margin:10px 0}
.tip b{color:var(--pri)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.cell{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:13px 6px;font:600 15px system-ui;min-height:54px;word-break:break-word}
.cell.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset}.cell.done{opacity:.28;pointer-events:none}.cell.no{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.answer{min-height:64px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:7px;align-items:flex-start;margin:10px 0}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:9px 12px;font:600 17px system-ui;box-shadow:var(--shadow)}
.tile.used{opacity:.25;pointer-events:none}.tile.in{border-color:var(--pri)}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.keys button{flex:1;min-width:38px;padding:10px 0;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:700 18px system-ui}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}.top .x{background:none;border:0;font-size:24px;color:var(--mute);padding:4px 8px}
.spk{background:none;border:0;font-size:22px;padding:4px 8px}
.stat{text-align:center}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.bars{display:flex;align-items:flex-end;gap:5px;height:90px}.bars div{flex:1;background:var(--pri);border-radius:5px 5px 0 0;min-height:3px;opacity:.85}
.bars.lbl{height:auto;margin-top:4px}.bars.lbl span{flex:1;text-align:center;font-size:10px;color:var(--mute)}
.user{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.user:last-child{border:0}.user .av{font-size:26px}
.big{font-size:56px;text-align:center}
.hide{display:none}
.seg.lv button{display:flex;flex-direction:column;align-items:center;font-size:16px;padding:7px 2px}
.seg.lv button small{font-size:10px;font-weight:600;opacity:.8;margin-top:1px}
.alt{font-size:15px;color:var(--mute);font-weight:500}

#app{padding-top:calc(14px + env(safe-area-inset-top))}</style>
</head>
